name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. linux-v1.0"
        required: true
        default: "linux-v1.0"
      title:
        description: "Release title"
        required: true
        default: "Linux v1.0"
      notes:
        description: "Path to release notes in the repo"
        required: true
        default: "docs/releases/linux-v1.0.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES"
