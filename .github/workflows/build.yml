# Checks the installers on real Windows and macOS machines and publishes the ready downloads.
name: build and test
on:
  push:
    branches: [main, installers]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: |
          set -o pipefail
          {
            bash macos/build.sh build && ditto -c -k --keepParent "build/TGTI AI Office.app" TGTI-AI-Office-mac.zip
          } 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Install (with a private Node.js copy)
        run: |
          set -o pipefail
          {
            TGTI_APP_ZIP="$PWD/TGTI-AI-Office-mac.zip" TGTI_FORCE_PORTABLE_NODE=1 TGTI_NO_OPEN=1 bash macos/install.sh
          } 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Check hooks and login item
        run: |
          set -o pipefail
          {
            grep -q "TGTI AI Office.app/Contents/Resources/hook.mjs" ~/.claude/settings.json
            grep -q "Application Support/TGTI AI Office/node/bin/node" ~/.claude/settings.json
            test -f ~/Library/LaunchAgents/com.thegrandees.aioffice.plist
          } 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Run the app (wallpaper picture + server + a fake Claude Code)
        run: |
          set -o pipefail
          {
            cp /bin/sleep /tmp/claude && (/tmp/claude 120 >/dev/null 2>&1 &)
            "$HOME/Applications/TGTI AI Office.app/Contents/MacOS/AIOffice" --selftest "$PWD/mac-wallpaper.png" | tee selftest.txt
            echo "::notice title=mac selftest::$(grep SELFTEST selftest.txt | tr '\n' ' ')"
            grep -q '"kind":"claude"' selftest.txt
            sleep 2; ! pgrep -f office-server.mjs
          } 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Share the screenshots (branch ci-shots)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/shots && cp mac-wallpaper*.png /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q && git checkout -q -b ci-shots && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "macOS screenshots" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-shots || true
      - name: Uninstall
        run: |
          set -o pipefail
          {
            bash macos/uninstall.sh
            test ! -e "$HOME/Applications/TGTI AI Office.app"
            ! grep -q "hook.mjs" ~/.claude/settings.json
          } 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Show the log on failure
        if: failure()
        run: echo "::error title=log::$(tail -80 "$RUNNER_TEMP/log.txt" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            TGTI-AI-Office-mac.zip
            mac-wallpaper*.png
      - name: Publish the macOS download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-latest >/dev/null 2>&1 || gh release create mac-latest --title "macOS app" --notes "Install: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/macos/install.sh | bash"
          gh release upload mac-latest TGTI-AI-Office-mac.zip --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install (with a private Node.js copy and a fake Wallpaper Engine folder)
        shell: powershell
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP\log.txt" -Append | Out-Null
          New-Item -ItemType Directory -Force "$env:TEMP\we\projects\myprojects" | Out-Null
          $env:TGTI_SOURCE = "$PWD"; $env:TGTI_FORCE_PORTABLE_NODE = '1'; $env:TGTI_WE_DIR = "$env:TEMP\we"
          & .\windows\install.ps1
          Stop-Transcript | Out-Null
      - name: Check files, hooks, wallpaper and task
        shell: powershell
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP\log.txt" -Append | Out-Null
          $App = "$env:LOCALAPPDATA\TGTI-AI-Office"
          if (-not (Test-Path "$App\node\node.exe")) { throw 'no node' }
          if (-not (Select-String -Path "$env:USERPROFILE\.claude\settings.json" -SimpleMatch 'TGTI-AI-Office/node/node.exe' -Quiet)) { throw 'hook has no node path' }
          foreach ($f in 'index.html', 'project.json', 'preview.jpg', 'fonts\tiny5-cyr.woff2') { if (-not (Test-Path "$env:TEMP\we\projects\myprojects\tgti-ai-office\$f")) { throw "wallpaper misses $f" } }
          $t = Get-ScheduledTask -TaskName 'TGTI AI Office'; $t.Triggers | Format-List | Out-String | Write-Host
          if (Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like '*office-server.mjs*' }) { throw 'server runs without Wallpaper Engine' }
          $pj = "$env:TEMP\we\projects\myprojects\tgti-ai-office\project.json"
          [IO.File]::WriteAllText($pj, [IO.File]::ReadAllText($pj).Replace('"file"', '"workshopid": "1234567", "file"'))
          $env:TGTI_SOURCE = "$PWD"; $env:TGTI_WE_DIR = "$env:TEMP\we"; & .\windows\install.ps1
          if (-not (Select-String -Path $pj -SimpleMatch '"workshopid": "1234567"' -Quiet)) { throw 'workshop id lost on update' }
          Get-Content $pj -Encoding UTF8 | Select-Object -First 5 | Write-Host
          Stop-Transcript | Out-Null
      - name: Server starts with Wallpaper Engine and stops after it
        shell: powershell
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP\log.txt" -Append | Out-Null
          Copy-Item C:\Windows\System32\PING.EXE "$env:TEMP\wallpaper64.exe"; Copy-Item C:\Windows\System32\PING.EXE "$env:TEMP\claude.exe"
          $we = Start-Process "$env:TEMP\wallpaper64.exe" -ArgumentList '-n 600 127.0.0.1' -WindowStyle Hidden -PassThru
          $cl = Start-Process "$env:TEMP\claude.exe" -ArgumentList '-n 600 127.0.0.1' -WindowStyle Hidden -PassThru
          Start-ScheduledTask -TaskName 'TGTI AI Office'
          $s = $null
          for ($i = 0; $i -lt 30 -and -not $s; $i++) { Start-Sleep 2; try { $s = Invoke-RestMethod http://127.0.0.1:7777/state } catch {} }
          if (-not $s) { throw 'server did not start' }
          Start-Sleep 6; $s = Invoke-RestMethod http://127.0.0.1:7777/state
          $s | ConvertTo-Json -Depth 4 | Write-Host
          if (-not ($s.agents | Where-Object { $_.kind -eq 'claude' })) { throw 'fake Claude Code not seen' }
          Stop-Process -Id $we.Id -Force
          $gone = $false
          for ($i = 0; $i -lt 40 -and -not $gone; $i++) { Start-Sleep 5; $gone = -not (Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like '*office-server.mjs*' }) }
          if (-not $gone) { throw 'server still running after Wallpaper Engine closed' }
          Write-Host "::notice title=windows::server stopped $($i * 5) s after Wallpaper Engine closed"
          Stop-Process -Id $cl.Id -Force
          Stop-Transcript | Out-Null
      - name: Uninstall
        shell: powershell
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP\log.txt" -Append | Out-Null
          & "$env:LOCALAPPDATA\TGTI-AI-Office\uninstall.ps1"
          if (Test-Path "$env:LOCALAPPDATA\TGTI-AI-Office") { throw 'folder left' }
          if (Get-ScheduledTask -TaskName 'TGTI AI Office' -ErrorAction SilentlyContinue) { throw 'task left' }
          if (Test-Path "$env:TEMP\we\projects\myprojects\tgti-ai-office") { throw 'wallpaper left' }
          if (Select-String -Path "$env:USERPROFILE\.claude\settings.json" -SimpleMatch 'hook.mjs' -Quiet) { throw 'hooks left' }
          Stop-Transcript | Out-Null
      - name: Publish the Windows download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format zip --prefix TGTI-AI-Office/ -o TGTI-AI-Office-windows.zip HEAD
          gh release view windows-latest >/dev/null 2>&1 || gh release create windows-latest --title "Windows" --notes "Install: open PowerShell and run  irm https://raw.githubusercontent.com/${{ github.repository }}/main/windows/install.ps1 | iex   (or unzip TGTI-AI-Office-windows.zip and double-click install-windows.cmd)"
          gh release upload windows-latest TGTI-AI-Office-windows.zip --clobber
      - name: Show the log on failure
        if: failure()
        shell: powershell
        run: |
          $t = (Get-Content "$env:RUNNER_TEMP\log.txt" -Tail 80) -join '%0A'
          Write-Host "::error title=log::$t"
